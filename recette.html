<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recette | À notre table</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navigation-recette">
        <nav class="navigation">
            <a href="index.html" class="retour">
                ← Retour aux recettes
            </a>
        </nav>
    </header>

    <main id="contenu-recette">
        <div class="message">
            Chargement de la recette…
        </div>
    </main>

    <footer>
        <p>À notre table ❤️</p>
    </footer>

    <script>
        const contenuRecette =
            document.getElementById("contenu-recette");

        const parametres =
            new URLSearchParams(window.location.search);

        const identifiantRecette =
            parametres.get("id");

        async function chargerRecette() {
            try {
                if (!identifiantRecette) {
                    throw new Error(
                        "Aucune recette n’a été sélectionnée."
                    );
                }

                const reponse = await fetch("./recettes.json");

                if (!reponse.ok) {
                    throw new Error(
                        "Impossible de charger les recettes."
                    );
                }

                const recettes = await reponse.json();

                const recette = recettes.find(function (element) {
                    return element.id === identifiantRecette;
                });

                if (!recette) {
                    throw new Error(
                        "Cette recette n’existe pas."
                    );
                }

                afficherRecette(recette);

            } catch (erreur) {
                console.error(erreur);

                contenuRecette.innerHTML = `
                    <div class="message">
                        <h1>Recette introuvable</h1>

                        <p>${erreur.message}</p>

                        <a href="index.html">
                            Retourner à toutes les recettes
                        </a>
                    </div>
                `;
            }
        }

        function afficherRecette(recette) {
            document.title =
                `${recette.nom} | À notre table`;

            const ingredientsHtml = recette.ingredients
                .map(function (ingredient, index) {
                    return `
                        <li class="ingredient-item">
                            <input
                                type="checkbox"
                                id="ingredient-${index}"
                                class="case-ingredient"
                            >

                            <label for="ingredient-${index}">
                                ${ingredient}
                            </label>
                        </li>
                    `;
                })
                .join("");

            const etapesHtml = recette.etapes
                .map(function (etape) {
                    return `<li>${etape}</li>`;
                })
                .join("");

            const astuceHtml = recette.astuce
                ? `
                    <aside class="conseil">
                        <h2>Astuce</h2>
                        <p>${recette.astuce}</p>
                    </aside>
                `
                : "";

            const illustrationHtml = recette.image
                ? `
                    <img
                        src="${recette.image}"
                        alt="${recette.nom}"
                        class="photo-recette photo-recette-detail"
                    >
                `
                : `
                    <span
                        role="img"
                        aria-label="Illustration de ${recette.nom}"
                    >
                        ${recette.emoji || "🍽️"}
                    </span>
                `;

            contenuRecette.innerHTML = `
                <article class="fiche-recette">

                    <div class="illustration">
                        ${illustrationHtml}
                    </div>

                    <div class="contenu">

                        <span class="categorie">
                            ${recette.categorieAffichee}
                        </span>

                        <h1>${recette.nom}</h1>

                        <p class="introduction">
                            ${recette.description}
                        </p>

                        <div class="informations-recette">

                            <div class="information">
                                <strong>Préparation</strong>
                                <span>
                                    ${recette.preparation} minutes
                                </span>
                            </div>

                            <div class="information">
                                <strong>Cuisson</strong>
                                <span>
                                    ${recette.cuisson} minutes
                                </span>
                            </div>

                            <div class="information">
                                <strong>Portions</strong>
                                <span>
                                    ${recette.personnes} personnes
                                </span>
                            </div>

                            <div class="information">
                                <strong>Difficulté</strong>
                                <span>
                                    ${recette.difficulte}
                                </span>
                            </div>

                        </div>

                        <div class="colonnes">

                            <section>
                                <h2>Ingrédients</h2>

                                <ul class="liste-ingredients">
                                    ${ingredientsHtml}
                                </ul>
                            </section>

                            <section>
                                <h2>Préparation</h2>

                                <ol>
                                    ${etapesHtml}
                                </ol>
                            </section>

                        </div>

                        ${astuceHtml}

                        <p class="auteur">
                            ${recette.auteur || ""}
                        </p>

                    </div>
                </article>
            `;

            const casesIngredients =
                document.querySelectorAll(".case-ingredient");

            casesIngredients.forEach(function (caseIngredient) {
                caseIngredient.addEventListener(
                    "change",
                    function () {
                        const ligneIngredient =
                            caseIngredient.closest(
                                ".ingredient-item"
                            );

                        if (caseIngredient.checked) {
                            ligneIngredient.classList.add(
                                "ingredient-coche"
                            );
                        } else {
                            ligneIngredient.classList.remove(
                                "ingredient-coche"
                            );
                        }
                    }
                );
            });
        }

        chargerRecette();
    </script>

</body>
</html>
