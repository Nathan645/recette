<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Recette | À notre table
    </title>

    <link
        rel="stylesheet"
        href="css/style.css?v=7"
    >

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <header class="navigation-recette">

        <nav class="navigation">

            <a
                href="index.html"
                class="retour"
            >
                ← Retour aux recettes
            </a>

        </nav>

    </header>



    <!-- =========================
         CONTENU DE LA RECETTE
    ========================== -->

    <main id="contenu-recette">


        <!-- =========================
             PHOTOS DE LA RECETTE
        ========================== -->

        <section
            class="galerie-recette"
            id="galerie-recette"
            hidden
            aria-label="Photos de la recette"
        >

            <div
                class="carousel-recette"
                id="carousel-recette"
            >

                <div
                    class="carousel-images-recette"
                    id="carousel-images-recette"
                >
                </div>


                <button
                    type="button"
                    class="bouton-carousel-recette bouton-carousel-precedent"
                    id="photo-precedente"
                    aria-label="Photo précédente"
                    hidden
                >
                    ‹
                </button>


                <button
                    type="button"
                    class="bouton-carousel-recette bouton-carousel-suivant"
                    id="photo-suivante"
                    aria-label="Photo suivante"
                    hidden
                >
                    ›
                </button>

            </div>


            <div
                class="indicateurs-carousel-recette"
                id="indicateurs-carousel-recette"
                hidden
                aria-label="Navigation entre les photos"
            >
            </div>

        </section>



        <!-- =========================
             FICHE RECETTE
        ========================== -->

        <div id="fiche-recette-contenu">

            <div class="message">
                Chargement de la recette…
            </div>

        </div>


    </main>



    <!-- =========================
         POPUP AJOUT AU PLANNING
    ========================== -->

    <div
        class="fond-popup-planning-recette"
        id="popup-ajout-planning"
        hidden
    >

        <div
            class="popup-planning-recette"
            role="dialog"
            aria-modal="true"
            aria-labelledby="titre-popup-planning"
        >


            <!-- =========================
                 FERMER
            ========================== -->

            <button
                type="button"
                class="fermer-popup-planning-recette"
                id="fermer-popup-planning"
                aria-label="Fermer"
            >
                ×
            </button>



            <!-- =========================
                 ENTÊTE
            ========================== -->

            <div class="entete-popup-planning-recette">

                <div>

                    <h2 id="titre-popup-planning">
                        Ajouter au planning
                    </h2>

                    <p
                        class="nom-recette-popup-planning"
                        id="nom-recette-popup-planning"
                    >
                    </p>

                </div>

            </div>



            <!-- =========================
                 DATE
            ========================== -->

            <div class="champ-popup-planning">

                <label for="date-ajout-planning">
                    Date
                </label>

                <input
                    type="date"
                    id="date-ajout-planning"
                >

            </div>



            <!-- =========================
                 MIDI / SOIR
            ========================== -->

            <div class="champ-popup-planning">

                <span class="label-popup-planning">
                    Quand ?
                </span>

                <div class="choix-moment-planning">

                    <button
                        type="button"
                        class="bouton-moment-planning actif"
                        id="moment-planning-midi"
                        data-moment="midi"
                    >
                        ☀️
                        Midi
                    </button>

                    <button
                        type="button"
                        class="bouton-moment-planning"
                        id="moment-planning-soir"
                        data-moment="soir"
                    >
                        🌙
                        Soir
                    </button>

                </div>

            </div>



            <!-- =========================
                 NOMBRE DE PERSONNES
            ========================== -->

            <div class="champ-popup-planning">

                <span class="label-popup-planning">
                    Pour combien de personnes ?
                </span>

                <div class="controle-personnes-planning">

                    <button
                        type="button"
                        id="diminuer-personnes-planning"
                        aria-label="Diminuer le nombre de personnes"
                    >
                        −
                    </button>

                    <strong
                        id="nombre-personnes-planning"
                    >
                        2
                    </strong>

                    <button
                        type="button"
                        id="augmenter-personnes-planning"
                        aria-label="Augmenter le nombre de personnes"
                    >
                        +
                    </button>

                </div>

            </div>



            <!-- =========================
                 MESSAGE
            ========================== -->

            <div
                class="message-popup-planning"
                id="message-popup-planning"
                hidden
            >
            </div>



            <!-- =========================
                 ACTIONS
            ========================== -->

            <div class="actions-popup-planning">

                <button
                    type="button"
                    class="bouton-annuler-planning"
                    id="annuler-ajout-planning"
                >
                    Annuler
                </button>

                <button
                    type="button"
                    class="bouton-confirmer-planning"
                    id="confirmer-ajout-planning"
                >
                    Ajouter au planning
                </button>

            </div>


        </div>

    </div>



    <!-- =========================
         POPUP CONFIRMATION
         CRÉNEAU DÉJÀ OCCUPÉ
    ========================== -->

    <div
        class="fond-popup-planning-recette"
        id="popup-confirmation-planning"
        hidden
    >

        <div
            class="popup-planning-recette popup-confirmation-planning"
            role="dialog"
            aria-modal="true"
            aria-labelledby="titre-confirmation-planning"
        >



            <h2 id="titre-confirmation-planning">
                Un repas est déjà prévu
            </h2>


            <p id="texte-confirmation-planning">

                Il y a déjà un repas prévu
                sur ce créneau.

                Êtes-vous sûr de vouloir
                ajouter cette recette ?

            </p>


            <div class="actions-popup-planning">

                <button
                    type="button"
                    class="bouton-annuler-planning"
                    id="annuler-confirmation-planning"
                >
                    Annuler
                </button>

                <button
                    type="button"
                    class="bouton-confirmer-planning"
                    id="confirmer-ajout-malgre-repas"
                >
                    Ajouter quand même
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            À notre table ❤️
        </p>

    </footer>



    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/supabase.js"></script>

    <script src="js/recette.js?v=6"></script>


</body>

</html>
