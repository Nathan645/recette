    <script>
    document.addEventListener("DOMContentLoaded", async function () {

        const {
            data: donneesUtilisateur
        } =
            await window.supabaseClient
                .auth
                .getUser();


        const utilisateur =
            donneesUtilisateur.user;


        if (!utilisateur) {

            window.location.replace(
                "compte.html"
            );

            return;
        }


        const {
            data: membre
        } =
            await window.supabaseClient
                .from("membres_foyer")
                .select("foyer_id")
                .eq(
                    "user_id",
                    utilisateur.id
                )
                .limit(1)
                .maybeSingle();


        if (!membre) {

            window.location.replace(
                "foyer.html"
            );
        }

    });
</script>
