<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>À notre table</title>

</head>

<body>

    <header class="entete-accueil">
    <h1>À notre table</h1>
    <p>Nos recettes, nos souvenirs et nos petits secrets de cuisine.</p>
</header>

    <main>
        <h2>Que souhaitons-nous cuisiner aujourd’hui ?</h2>

        <input
            type="search"
            class="recherche"
            id="recherche"
            placeholder="Rechercher une recette ou un ingrédient…"
        >

      <div class="filtres">
    <button class="filtre actif" data-categorie="toutes">
        Toutes les recettes
    </button>

    <button class="filtre" data-categorie="apéritif">
        Apéritifs
    </button>

    <button class="filtre" data-categorie="entrée">
        Entrées
    </button>

    <button class="filtre" data-categorie="plat">
        Plats
    </button>

    <button class="filtre" data-categorie="dessert">
        Desserts
    </button>

    <button class="filtre" data-categorie="boisson">
        Boissons
    </button>
</div>

        <div class="actions-accueil">
    <a href="ajouter.html" class="bouton-ajouter">
        + Ajouter une recette
    </a>
</div>

        <section
    class="grille-recettes"
    id="grille-recettes"
>
    <p>Chargement des recettes…</p>
            
</section>
        
    </main>

    <footer>
        <p>Le carnet de recettes de notre famille ❤️</p>
    </footer>

   <script src="app.js"></script>

</body>
</html>
