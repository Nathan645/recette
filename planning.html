<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Planning | À notre table</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/planning.css"
    >

</head>


<body>

    <header class="entete-principale">

        <div class="bloc-marque">

            <h1>
                À notre table
            </h1>

            <p>
                Nos recettes, nos souvenirs et nos petits secrets de cuisine.
            </p>

            <div
                class="infos-utilisateur"
                id="infos-utilisateur"
                hidden
            >

                <span>
                    Bonjour
                    <strong id="prenom-utilisateur"></strong>
                </span>

                <span class="separateur-utilisateur">
                    •
                </span>

                <span>
                    Foyer :
                    <strong id="nom-foyer-utilisateur"></strong>
                </span>

            </div>

        </div>


        <nav class="navigation-principale">

            <a
                href="index.html"
                class="lien-navigation"
            >
                Recettes
            </a>

            <a
                href="planning.html"
                class="lien-navigation actif"
            >
                Planning
            </a>

            <a
                href="courses.html"
                class="lien-navigation"
            >
                Courses
            </a>

           <a href="mon-compte.html">
    Compte
</a>

        </nav>

    </header>


    <main class="page-planning">

        <section class="entete-planning">

            <span class="sur-titre-planning">
                Organisation
            </span>

            <h2>
                Planning des repas
            </h2>

            <p>
                Préparez les repas de votre foyer semaine par semaine.
            </p>

        </section>


        <section class="navigation-semaine">

            <button
                type="button"
                class="bouton-navigation-semaine"
                id="semaine-precedente"
                aria-label="Semaine précédente"
            >
                ←
            </button>


            <div class="semaine-actuelle">

                <span
                    class="numero-semaine"
                    id="numero-semaine"
                >
                    Semaine
                </span>

                <h3 id="titre-semaine">
                    Chargement…
                </h3>

            </div>


            <button
                type="button"
                class="bouton-navigation-semaine"
                id="semaine-suivante"
                aria-label="Semaine suivante"
            >
                →
            </button>

        </section>


        <div class="actions-semaine">

            <button
                type="button"
                class="bouton-aujourdhui"
                id="aller-aujourdhui"
            >
                Aujourd'hui
            </button>

        </div>


        <section
            class="grille-semaine"
            id="grille-semaine"
        >

            <p>
                Chargement du planning…
            </p>

        </section>

    </main>


    <div
        class="fond-popup-planning"
        id="popup-repas"
        hidden
    >

        <div
            class="popup-repas"
            role="dialog"
            aria-modal="true"
        >

            <button
                type="button"
                class="fermer-popup-repas"
                id="fermer-popup-repas"
                aria-label="Fermer"
            >
                ×
            </button>


            <h2>
                Ajouter un repas
            </h2>


            <p
                class="date-popup-repas"
                id="date-popup-repas"
            ></p>


            <div class="choix-type-repas">

                <button
                    type="button"
                    class="type-repas actif"
                    id="choisir-recette"
                >
                    Depuis les recettes
                </button>

                <button
                    type="button"
                    class="type-repas"
                    id="choisir-libre"
                >
                    Repas libre
                </button>

            </div>


            <div
                class="bloc-recette-planning"
                id="bloc-recette-planning"
            >

                <label for="recherche-recette-planning">
                    Rechercher une recette
                </label>

                <input
                    type="search"
                    id="recherche-recette-planning"
                    placeholder="Carbonara, curry, salade…"
                >

                <div
                    class="resultats-recettes-planning"
                    id="resultats-recettes-planning"
                ></div>

            </div>


            <div
                class="bloc-repas-libre"
                id="bloc-repas-libre"
                hidden
            >
                

                <label for="nom-repas-libre">
                    Nom du repas
                </label>

                <input
                    type="text"
                    id="nom-repas-libre"
                    placeholder="Restaurant, pizza, chez les parents…"
                >

                <button
                    type="button"
                    class="bouton-valider-repas"
                    id="valider-repas-libre"
                >
                    Ajouter au planning
                </button>

                <button
                    type="button"
                    class="bouton-supprimer-repas"
                    id="supprimer-repas-planning"
                    hidden
                    >
                    Vider ce créneau
                </button>

            </div>

                <button
                    type="button"
                    class="bouton-supprimer-repas"
                    id="supprimer-repas-planning"
                    hidden
                >
                Vider ce créneau
                </button>
            
            <p
                class="message-planning"
                id="message-planning"
            ></p>

        </div>

    </div>


 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/session.js"></script>
<script src="js/planning-core.js"></script>
<script src="js/planning-data.js"></script>
<script src="js/planning-ui.js"></script>
<script src="js/planning-popup.js"></script>
<script src="js/planning.js"></script>

</body>

</html>
